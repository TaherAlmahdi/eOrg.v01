# Sends content/stories/*.md to Supabase (stories, people, story_people) when they change on main.
# The sync script lives in the eStory repo; this workflow checks it out next to the books.
# Secrets needed in this repo: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# and ESTORY_REPO_TOKEN (a token that can read TaherAlmahdi/eStory; not needed if that repo is public).
name: Sync stories to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the books
        uses: actions/checkout@v4
        with:
          path: books

      - name: Check out the sync script (eStory)
        uses: actions/checkout@v4
        with:
          repository: TaherAlmahdi/eStory
          ref: main
          path: estory
          token: ${{ secrets.ESTORY_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: estory
        run: npm ci

      - name: Sync stories
        working-directory: estory
        env:
          STORIES_ROOT: ${{ github.workspace }}/books/content/stories
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-stories
