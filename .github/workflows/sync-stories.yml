# Sends content/stories/*.md to Supabase (stories, people, story_people) when they change on main.
# Secrets needed in this repo: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
name: Sync stories to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'content/stories/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Sync stories
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run sync-stories
